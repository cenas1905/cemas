    <!-- Hız: Harici kaynakları önceden bağla -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root { --ana: #0f0f0f; --vurgu: #e67e22; --gri: #1e1e1e; --beyaz: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background: var(--ana); color: var(--beyaz); line-height: 1.6; overflow-x: hidden; }

        /* HEADER DÜZENİ */
        nav {
            padding: 0 5%; background: rgba(0,0,0,0.95);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #333; height: 80px;
        }
        .nano-tetikleyici { font-size: 35px; color: var(--vurgu); cursor: pointer; transition: 0.3s; flex: 1; }
        .logo { font-weight: 900; font-size: 32px; letter-spacing: 5px; flex: 2; text-align: center; }
        .logo span { color: var(--vurgu); }
        .iletisim-sag { flex: 1; text-align: right; font-size: 11px; font-weight: 600; }
        .iletisim-sag a { color: var(--beyaz); text-decoration: none; }

        /* NANO BANANA ÇALIŞMA ALANI (FULL SCREEN) */
        #nano-ekran {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; flex-direction: column;
        }
        .nano-ust { padding: 15px; background: var(--gri); display: flex; justify-content: space-between; align-items: center; }
        #montaj-alani { flex: 1; position: relative; overflow: hidden; background: #111; display: flex; justify-content: center; align-items: center; }
        #musteri-resmi { max-width: 100%; max-height: 100%; object-fit: contain; }
        #tasinan-model { position: absolute; width: 200px; cursor: move; touch-action: none; z-index: 100; top: 50px; left: 50px; }
        .nano-alt { padding: 15px; background: var(--gri); border-top: 1px solid #333; }
        
        /* STANDART SİTE TASARIMI */
        .vitrin { position: relative; width: 95%; max-width: 1100px; height: 350px; margin: 20px auto; border-radius: 15px; overflow: hidden; border: 2px solid #333; }
        .v-img { width: 100%; height: 100%; object-fit: contain; display: none; }
        .v-img.aktif { display: block; }

        .menu { display: flex; justify-content: center; gap: 10px; padding: 20px; background: var(--gri); position: sticky; top: 80px; z-index: 900; }
        .m-btn { padding: 10px 20px; border: 2px solid var(--vurgu); background: transparent; color: #fff; border-radius: 50px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .m-btn.active { background: var(--vurgu); }

        .bolum { display: none; padding: 30px 5%; animation: fadeIn 0.5s; }
        .bolum.aktif { display: block; }
        .izgara { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .kart { background: #1a1a1a; border-radius: 10px; overflow: hidden; border: 1px solid #333; }
        .kart img { width: 100%; height: 220px; object-fit: cover; }
        .kart h3 { padding: 10px 15px 5px; color: var(--vurgu); font-size: 14px; text-align: center; }
        .kart p { padding: 0 15px 15px; color: #aaa; font-size: 11px; text-align: center; line-height: 1.4; }

        /* MERDİVEN ALT SEKMELERİ */
        .alt-menu { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .alt-btn {
            padding: 8px 22px; border: 1px solid #555; background: transparent;
            color: #ccc; border-radius: 30px; cursor: pointer; font-size: 11px;
            font-weight: 600; font-family: 'Montserrat', sans-serif; transition: 0.3s;
        }
        .alt-btn:hover { border-color: var(--vurgu); color: var(--vurgu); }
        .alt-btn.aktif-alt { background: var(--vurgu); border-color: var(--vurgu); color: #fff; }
        .alt-bolum { display: none; animation: fadeIn 0.4s; }
        .alt-bolum.aktif-bolum { display: block; }
        .yakin-gelecek {
            text-align: center; padding: 60px 20px; color: #555;
            border: 2px dashed #333; border-radius: 10px;
        }
        .yakin-gelecek i { font-size: 40px; color: #444; display: block; margin-bottom: 15px; }
        .yakin-gelecek span { font-size: 13px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        footer { text-align: center; padding: 30px; color: #555; font-size: 12px; }
    </style>
</head>
<body>

    <nav>
        <input type="file" id="dosya-sec" style="display:none;" accept="image/*" onchange="nanoBaslat(event)">
        <div class="nano-tetikleyici" onclick="document.getElementById('dosya-sec').click()">
            <i class="fas fa-plus-circle"></i>
        </div>
        <div class="logo">CEM_<span>AS</span></div>
        <div class="iletisim-sag">
            <a href="https://instagram.com/cemashatay" target="_blank">@cemashatay</a><br>
            <a href="tel:05337747684">0533 774 76 84</a>
        </div>
    </nav>

    <div id="nano-ekran">
        <div class="nano-ust">
            <span style="color:var(--vurgu); font-weight:900;">NANO BANANA</span>
            <button onclick="nanoKapat()" style="background:var(--vurgu); color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">KAPAT</button>
        </div>
        <div id="montaj-alani">
            <img id="musteri-resmi" src="">
            <img id="tasinan-model" src="korkuluk1.jpg">
        </div>
        <div class="nano-alt">
            <div style="margin-bottom:15px; display:flex; align-items:center; gap:10px;">
                <span style="font-size:12px;">Boyut:</span>
                <input type="range" min="50" max="1000" value="200" style="flex:1;" oninput="modelBoyut(this.value)">
            </div>
            <div style="display:flex; gap:10px; overflow-x:auto;">
                <img src="korkuluk1.jpg" width="60" height="60" onclick="modelDegis(this.src)" style="border:1px solid #fff; cursor:pointer;">
                <img src="korkuluk2.jpg" width="60" height="60" onclick="modelDegis(this.src)" style="border:1px solid #fff; cursor:pointer;">
                <img src="dusakabin1.jpg" width="60" height="60" onclick="modelDegis(this.src)" style="border:1px solid #fff; cursor:pointer;">
                <img src="pvc1.jpg" width="60" height="60" onclick="modelDegis(this.src)" style="border:1px solid #fff; cursor:pointer;">
            </div>
        </div>
    </div>

    <div class="vitrin">
        <img src="vitrin1.jpg" class="v-img aktif">
        <img src="vitrin2.jpg" class="v-img">
    </div>

    <div class="menu">
        <button class="m-btn active" onclick="sekmeAc('korkuluk', this)">Korkuluk</button>
        <button class="m-btn" onclick="sekmeAc('merdivenler', this)">Merdivenler</button>
        <button class="m-btn" onclick="sekmeAc('cambalkon', this)">Cam Balkon</button>
        <button class="m-btn" onclick="sekmeAc('dusakabin', this)">Duşakabin</button>
        <button class="m-btn" onclick="sekmeAc('pvc', this)">PVC & Cam</button>
    </div>

    <div id="korkuluk" class="bolum aktif">
        <div class="izgara" id="korkuluk-izgara">
            <!-- Veriler JS ile yüklenecek -->
        </div>
    </div>

    <div id="merdivenler" class="bolum">
        <!-- Alt Sekmeler -->
        <div class="alt-menu">
            <button class="alt-btn aktif-alt" onclick="altSekmeAc('m-pleksi', this)">✨ Pleksi</button>
            <button class="alt-btn" onclick="altSekmeAc('m-camli', this)">🔷 Camlı</button>
            <button class="alt-btn" onclick="altSekmeAc('m-normal', this)">⚙️ Normal</button>
        </div>

        <!-- Pleksi -->
        <div id="m-pleksi" class="alt-bolum aktif-bolum">
            <div class="izgara" id="merdiven-pleksi-izgara"></div>
        </div>

        <!-- Camlı -->
        <div id="m-camli" class="alt-bolum">
            <div class="izgara" id="merdiven-camli-izgara">
                <div class="yakin-gelecek">
                    <i class="fas fa-camera"></i>
                    <span>Camlı merdiven fotoğrafları yakında eklenecek...</span>
                </div>
            </div>
        </div>

        <!-- Normal -->
        <div id="m-normal" class="alt-bolum">
            <div class="izgara" id="merdiven-normal-izgara"></div>
        </div>
    </div>

    <div id="cambalkon" class="bolum">
        <div class="izgara" id="cambalkon-izgara">
             <!-- Veriler JS ile yüklenecek -->
        </div>
    </div>

    <div id="dusakabin" class="bolum">
        <div class="izgara" id="dusakabin-izgara">
             <!-- Veriler JS ile yüklenecek -->
        </div>
    </div>

    <div id="pvc" class="bolum">
        <div class="izgara" id="pvc-izgara">
             <!-- Veriler JS ile yüklenecek -->
        </div>
    </div>

    <footer>CEM_AS MİMARİ SİSTEMLER - 2026</footer>

    <script>
        // İÇERİK YÜKLEME
        fetch('data/content.json')
            .then(res => res.json())
            .then(data => {
                const render = (id, items) => {
                    const el = document.getElementById(id);
                    if (el && items) {
                        el.innerHTML = items.map(item => `
                            <div class="kart">
                                <img src="${item.image.replace('websitem/', '')}" onerror="this.src='${item.image}'">
                                <h3>${item.title}</h3>
                                ${item.desc ? `<p>${item.desc}</p>` : ''}
                            </div>
                        `).join('');
                    }
                };
                render('korkuluk-izgara', data.korkuluk);
                render('merdiven-pleksi-izgara', data.merdiven_pleksi);
                render('merdiven-normal-izgara', data.merdiven_normal);
                render('cambalkon-izgara', data.cambalkon);
                render('dusakabin-izgara', data.dusakabin);
                render('pvc-izgara', data.pvc);
            });

        // ANA SEKME GEÇİŞLERİ
        function sekmeAc(id, el) {
            document.querySelectorAll('.bolum').forEach(b => b.classList.remove('aktif'));
            document.querySelectorAll('.m-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('aktif');
            el.classList.add('active');
        }

        // MERDİVEN ALT SEKME GEÇİŞLERİ
        function altSekmeAc(id, el) {
            document.querySelectorAll('.alt-bolum').forEach(b => b.classList.remove('aktif-bolum'));
            document.querySelectorAll('.alt-btn').forEach(b => b.classList.remove('aktif-alt'));
            document.getElementById(id).classList.add('aktif-bolum');
            el.classList.add('aktif-alt');
        }

        // NANO BANANA MOTORU
        const ekran = document.getElementById('nano-ekran');
        const model = document.getElementById('tasinan-model');
        
        function nanoBaslat(e) {
            const okuyucu = new FileReader();
            okuyucu.onload = function(ev) {
                document.getElementById('musteri-resmi').src = ev.target.result;
                ekran.style.display = 'flex';
            }
            okuyucu.readAsDataURL(e.target.files[0]);
        }

        function nanoKapat() { ekran.style.display = 'none'; }
        function modelDegis(src) { model.src = src; }
        function modelBoyut(v) { model.style.width = v + 'px'; }

        // SÜRÜKLE BIRAK SİSTEMİ
        let hareket = false, sX, sY, bL, bT;
        const basla = (e) => {
            hareket = true;
            const ev = e.type.includes('touch') ? e.touches[0] : e;
            sX = ev.clientX; sY = ev.clientY;
            bL = model.offsetLeft; bT = model.offsetTop;
        };
        const surukle = (e) => {
            if(!hareket) return;
            const ev = e.type.includes('touch') ? e.touches[0] : e;
            model.style.left = (bL + (ev.clientX - sX)) + 'px';
            model.style.top = (bT + (ev.clientY - sY)) + 'px';
        };
        model.addEventListener('mousedown', basla);
        model.addEventListener('touchstart', basla);
        window.addEventListener('mousemove', surukle);
        window.addEventListener('touchmove', surukle, {passive:false});
        window.addEventListener('mouseup', () => hareket = false);
        window.addEventListener('touchend', () => hareket = false);
    </script>
</body>
</html>
